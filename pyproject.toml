[project]
name = "maintain-x"
version = "0.1.0"
description = "Multimodal AI platform for predictive industrial maintenance"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "matplotlib",
    "seaborn",
    "jupyter",
    "pyyaml",
    "pydantic",
    "fastapi",
    "uvicorn",
    "joblib",
    "pyarrow",
    "mlflow",
    "boto3",
    "psycopg2-binary",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "pre-commit",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: requires the real NASA C-MAPSS dataset (runs only when the archive is present in data/raw)",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
